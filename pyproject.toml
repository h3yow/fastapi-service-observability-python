[project]
name = "fastapi-service-observability-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
log_cli = false
log_file = "test-observability.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
log_file_date_format = "%H:%M:%S"
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
